name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare docs build metadata
        run: |
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          {
            echo "DOCS_ENVIRONMENT=ci"
            echo "DOCS_BUILD_SHA=${GITHUB_SHA}"
            echo "DOCS_BUILD_TIME=${build_time}"
          } >> "$GITHUB_ENV"
      - run: pnpm docs:validate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, docs-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare docs shell metadata
        run: |
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          {
            echo "DOCS_ENVIRONMENT=ci"
            echo "DOCS_BUILD_SHA=${GITHUB_SHA}"
            echo "DOCS_BUILD_TIME=${build_time}"
            echo "VITE_DOCS_ENVIRONMENT=ci"
            echo "VITE_DOCS_SITE_URL=https://docs.mytuums.com"
            echo "VITE_DOCS_API_BASE_URL=https://api.mytuums.com"
            echo "VITE_DOCS_BUILD_SHA=${GITHUB_SHA}"
            echo "VITE_DOCS_BUILD_TIME=${build_time}"
          } >> "$GITHUB_ENV"
      - run: pnpm build

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mytuums
          POSTGRES_PASSWORD: mytuums_test
          POSTGRES_DB: mytuums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://mytuums:mytuums_test@localhost:5432/mytuums_test
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
